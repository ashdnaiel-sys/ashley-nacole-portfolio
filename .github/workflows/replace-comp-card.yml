name: Finalize high-resolution Ashley comp card

on:
  push:
    paths:
      - '.github/workflows/replace-comp-card.yml'

permissions:
  contents: write

jobs:
  finalize-comp-card:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build the final 1137 x 1473 static comp card
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          root = Path('ashley-nacole-model-portfolio/public/images')
          portfolio = root / 'portfolio'
          target = root / 'comp-card' / 'ashley-nacole-comp-card.jpg'

          WIDTH, HEIGHT = 1137, 1473
          canvas = Image.new('RGB', (WIDTH, HEIGHT), 'white')
          margin, gap, top, row = 88, 22, 58, 516
          col = (WIDTH - margin * 2 - gap) // 2
          second = top + row + 20

          sources = [
              ('lifestyle-denim-back-close.jpeg', 0.50, 0.43, margin, top),
              ('lifestyle-denim-jacket-smile.jpeg', 0.50, 0.47, margin + col + gap, top),
              ('lifestyle-denim-seated-full.jpeg', 0.50, 0.50, margin, second),
              ('lifestyle-denim-stool-soft-smile.jpeg', 0.50, 0.45, margin + col + gap, second),
          ]

          def cover_crop(image, width, height, fx=.5, fy=.5):
              sw, sh = image.size
              source_ratio = sw / sh
              target_ratio = width / height
              if source_ratio > target_ratio:
                  crop_h = sh
                  crop_w = crop_h * target_ratio
                  left = max(0, min(sw - crop_w, sw * fx - crop_w / 2))
                  upper = 0
              else:
                  crop_w = sw
                  crop_h = crop_w / target_ratio
                  left = 0
                  upper = max(0, min(sh - crop_h, sh * fy - crop_h / 2))
              box = (round(left), round(upper), round(left + crop_w), round(upper + crop_h))
              return image.crop(box).resize((width, height), Image.Resampling.LANCZOS)

          for filename, fx, fy, x, y in sources:
              with Image.open(portfolio / filename).convert('RGB') as source:
                  canvas.paste(cover_crop(source, col, row, fx, fy), (x, y))

          draw = ImageDraw.Draw(canvas)
          font_path = '/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf'
          regular38 = ImageFont.truetype(font_path, 38)
          regular23 = ImageFont.truetype(font_path, 23)
          regular22 = ImageFont.truetype(font_path, 22)
          ink = '#111111'

          text_y = second + row + 39
          draw.text((margin, text_y), 'ASHLEY NACOLE / MODEL', font=regular38, fill=ink, anchor='la')
          line = 33
          left_label, left_value = margin, margin + 104
          right_label, right_value = margin + 390, margin + 498
          base = text_y + 44
          left = [('HEIGHT', "5’8"), ('BUST', '32.5”'), ('WAIST', '25.5”'), ('HIPS', '37”')]
          right = [('SHOES', '9'), ('HAIR', 'BROWN'), ('EYES', 'BROWN')]
          for i, (label, value) in enumerate(left):
              y = base + i * line
              draw.text((left_label, y), label, font=regular23, fill=ink, anchor='la')
              draw.text((left_value, y), value, font=regular23, fill=ink, anchor='la')
          for i, (label, value) in enumerate(right):
              y = base + i * line
              draw.text((right_label, y), label, font=regular23, fill=ink, anchor='la')
              draw.text((right_value, y), value, font=regular23, fill=ink, anchor='la')

          rule_y = 1390
          draw.line((margin, rule_y, WIDTH - margin, rule_y), fill=ink, width=2)
          footer_y = rule_y + 15
          draw.text((margin, footer_y), 'NEAL HAMIL AGENCY', font=regular22, fill=ink, anchor='la')
          draw.text((WIDTH - margin, footer_y), 'ASHLEYNACOLE011@GMAIL.COM', font=regular22, fill=ink, anchor='ra')

          target.parent.mkdir(parents=True, exist_ok=True)
          canvas.save(target, 'JPEG', quality=96, subsampling=0, optimize=True, progressive=True)
          assert canvas.size == (1137, 1473)
          assert target.stat().st_size > 100000
          print(target, canvas.size, target.stat().st_size)
          PY

      - name: Make the website use the static comp card directly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          preview = Path('ashley-nacole-model-portfolio/preview.html')
          text = preview.read_text()
          old = '<a class="comp-card-link" href="/?compcard=1" aria-label="Open Ashley Nacole high-resolution comp card">Open / Save Comp Card ↗</a>'
          new = '<a class="comp-card-link" href="public/images/comp-card/ashley-nacole-comp-card.jpg" target="_blank" rel="noreferrer" aria-label="Open Ashley Nacole high-resolution comp card">Open / Save Comp Card ↗</a>'
          if old not in text:
              raise SystemExit('Expected comp-card link was not found in preview.html')
          text = text.replace(old, new, 1)

          script_start = text.find('  <script>\n    (async function () {')
          if script_start != -1:
              script_end = text.find('  </script>', script_start)
              if script_end == -1:
                  raise SystemExit('Comp-card script start found without closing script tag')
              text = text[:script_start] + text[script_end + len('  </script>'):]

          preview.write_text(text)
          PY

          cat > ashley-nacole-model-portfolio/components/CompCardViewer.tsx <<'TSX'
          const COMP_CARD = '/images/comp-card/ashley-nacole-comp-card.jpg';

          export function CompCardViewer() {
            return (
              <main
                style={{
                  minHeight: '100svh',
                  background: '#efefef',
                  padding: '18px 14px 40px',
                  display: 'flex',
                  flexDirection: 'column',
                  alignItems: 'center',
                  gap: '14px',
                }}
              >
                <div
                  style={{
                    width: 'min(100%, 760px)',
                    display: 'flex',
                    justifyContent: 'space-between',
                    alignItems: 'center',
                    gap: '14px',
                    flexWrap: 'wrap',
                    fontSize: '11px',
                    textTransform: 'uppercase',
                    letterSpacing: '.1em',
                  }}
                >
                  <a href="/digitals" style={{ borderBottom: '1px solid currentColor', paddingBottom: '3px' }}>
                    ← Digitals
                  </a>
                  <a
                    href={COMP_CARD}
                    download="Ashley-Nacole-Comp-Card.jpg"
                    style={{ borderBottom: '1px solid currentColor', paddingBottom: '3px' }}
                  >
                    Save High-Resolution JPG ↓
                  </a>
                </div>

                <a href={COMP_CARD} target="_blank" rel="noreferrer" style={{ width: 'min(100%, 760px)' }}>
                  <img
                    src={COMP_CARD}
                    alt="Ashley Nacole high-resolution model comp card"
                    width={1137}
                    height={1473}
                    style={{
                      display: 'block',
                      width: '100%',
                      height: 'auto',
                      background: '#fff',
                      boxShadow: '0 8px 28px rgba(0,0,0,.14)',
                    }}
                  />
                </a>

                <p style={{ width: 'min(100%, 760px)', margin: 0, color: '#555', fontSize: '12px', textAlign: 'center' }}>
                  Tap the card to open it full size. On iPhone, you can also press and hold the image to save it to Photos.
                </p>
              </main>
            );
          }
          TSX

      - name: Commit final static comp card implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ashdnaiel-sys'
          git config user.email 'ashdnaiel@gmail.com'
          git add \
            ashley-nacole-model-portfolio/public/images/comp-card/ashley-nacole-comp-card.jpg \
            ashley-nacole-model-portfolio/preview.html \
            ashley-nacole-model-portfolio/components/CompCardViewer.tsx
          if git diff --cached --quiet; then
            echo 'Static comp card implementation already matches.'
            exit 0
          fi
          git commit -m 'Use static high-resolution comp card everywhere'
          git push
